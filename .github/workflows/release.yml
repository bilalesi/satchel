name: Release

# Every push to main that changes the app builds, tests, signs and uploads a DMG to the private R2 bucket
# `satchel-releases`. satchel.echospace.dev serves the download page and the update feed from it; nothing is
# published on GitHub.
on:
  push:
    branches: [main]
    # Only changes to the app (or to this pipeline) release; docs, templates and repository settings do not.
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Resources/**"
      - "scripts/**"
      - "extension/**"
      - "Package.swift"
      - "Package.resolved"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # let a running release finish; the next push queues behind it

jobs:
  release:
    runs-on: macos-26
    # The signing keys and the upload token belong to this environment (restrict it to `main` in the repository
    # settings), so a workflow edited on another branch cannot read them.
    environment: release
    timeout-minutes: 60
    steps:
      # Actions are pinned to a full commit hash, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is derived from the commit count
          persist-credentials: false

      - name: Select the newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Version
        run: |
          COUNT="$(git rev-list --count HEAD)"
          echo "VERSION=0.1.${COUNT}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${COUNT}" >> "$GITHUB_ENV"

      # With all Apple secrets the app is signed with Developer ID and notarized; without them it stays ad hoc.
      - name: Import the Developer ID certificate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$P12" ] || [ -z "$P12_PASSWORD" ] || [ -z "$APPLE_API_KEY_ID" ] \
             || [ -z "$APPLE_API_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::Apple signing secrets are not all set: the app is signed ad hoc and not notarized."
            exit 0
          fi
          # A throwaway keychain for this run only, with a random password.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -v team="($APPLE_TEAM_ID)" '/Developer ID Application/ && index($0, team) { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The certificate has no Developer ID Application identity for team $APPLE_TEAM_ID."
            exit 1
          fi
          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "SIGN_KEYCHAIN=$KEYCHAIN"
            echo "NOTARIZE=1"
          } >> "$GITHUB_ENV"

      - name: Build universal DMG
        run: UNIVERSAL=1 ./scripts/make-dmg.sh

      - name: Notarize and staple
        if: env.NOTARIZE == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG="build/Satchel-${VERSION}.dmg"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # The key may be stored as the .p8 text or base64 of it.
          case "$APPLE_API_KEY_P8" in
            -----BEGIN*) printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY" ;;
            *) printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY" ;;
          esac
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > build/notary.json
          STATUS="$(jq -r .status build/notary.json)"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization returned: $STATUS"
            xcrun notarytool log "$(jq -r .id build/notary.json)" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            rm -f "$KEY"
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          # Stapling changed the file: its checksum is taken again.
          ( cd build && shasum -a 256 "Satchel-${VERSION}.dmg" > "Satchel-${VERSION}.dmg.sha256" )

      - name: Sign the update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          DMG="build/Satchel-${VERSION}.dmg"
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set. Installed apps only accept signed updates."
            exit 1
          fi
          swift scripts/update-key.swift sign "$DMG" > "$DMG.sig"
          # Prove the signature matches the public key the app ships with before uploading.
          swift scripts/update-key.swift verify "$DMG" "$DMG.sig" Resources/update-public-key.txt

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_R2_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in the release environment."
            exit 1
          fi
          DMG="build/Satchel-${VERSION}.dmg"
          FILE="releases/Satchel-${VERSION}.dmg"
          put() { npx --yes wrangler@4.151.2 r2 object put "satchel-releases/$1" --file "$2" --content-type "$3" --remote; }
          put "$FILE" "$DMG" application/x-apple-diskimage
          put "$FILE.sig" "$DMG.sig" text/plain
          jq -n \
            --arg version "$VERSION" --arg file "$FILE" --argjson size "$(stat -f%z "$DMG")" \
            --arg sha256 "$(cut -d' ' -f1 "$DMG.sha256")" --arg signature "$(tr -d '[:space:]' < "$DMG.sig")" \
            --arg notes "$(git log -1 --format=%s)" --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, file: $file, size: $size, sha256: $sha256, signature: $signature, notes: $notes, published: $published}' \
            > build/latest.json
          cat build/latest.json
          # Last: the download page and installed apps see a release only once all its files are in place.
          put latest.json build/latest.json application/json

      - name: Remove the signing keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
